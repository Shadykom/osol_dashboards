        description:
          type: string
        customer_type:
          type: string
          enum: [RETAIL, SME, CORP]
        secured_flag:
          type: boolean
          nullable: true
        priority:
          type: integer
          default: 100
        metadata:
          type: object
        created_by:
          type: string
          format: uuid

    CreateVersionRequest:

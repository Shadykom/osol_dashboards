                allowed:
                  type: integer
                blocked:
                  type: integer
                approval_required:
                  type: integer
                errors:
                  type: integer
            results:
              type: object
              properties:
                allowed:
                  type: array
                  items:
                    type: object
                blocked:
                  type: array
                  items:
                    type: object
                approval_required:
                  type: array
                  items:
                    type: object
                errors:
                  type: array
                  items:
                    type: object

    ActionApprovalsResponse:

    # =====================================================
    # Action Schemas
    # =====================================================

    ContactActionRequest:
      type: object
      required:
        - tenant_id
        - customer_id
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Tenant identifier
        customer_id:
          type: string
          description: Customer identifier
        contract_id:
          type: string
          description: Contract/loan identifier
        channel:
          type: string
          enum: [CALL, SMS, EMAIL, WHATSAPP, IVR]
          description: Communication channel
        action_type:
          type: string
          enum: [CALL, SMS, EMAIL, WHATSAPP, IVR, FIELD_VISIT]
          description: Type of contact action
        customer_type:
          type: string
          enum: [RETAIL, SME, CORP]
          default: RETAIL
          description: Customer segment
        consent_status:
          type: string
          enum: [GIVEN, NOT_GIVEN, WITHDRAWN, PENDING]
          description: Customer consent status
        bucket:
          type: string
          description: Delinquency bucket
        contact_history:
          $ref: '#/components/schemas/ContactHistory'
        requester_id:
          type: string
          description: ID of the user/agent initiating the action
        message:
          type: string
          description: Message content for SMS/Email
        metadata:
          type: object
          description: Additional metadata

    ContactActionResponse:
      type: object
      properties:
        success:
          type: boolean
        status:
          type: integer
        data:
          type: object
          properties:
            action_id:
              type: string
              description: Unique action identifier
            action_type:
              type: string
            channel:
              type: string
            customer_id:
              type: string
            contract_id:
              type: string
            status:
              type: string
              enum: [INITIATED, QUEUED, EXECUTED]
            message:
              type: string
            pdp_decision:
              type: object
              properties:
                decision:
                  type: string
                policy_profile_id:
                  type: string
                policy_version_id:
                  type: string
            initiated_at:
              type: string
              format: date-time

    ApprovalRequiredResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: integer
          example: 202
        message:
          type: string
          example: "Action requires approval"
        approval_id:
          type: string
          format: uuid
        reason_code:
          type: string
        reason_details:
          type: array
          items:
            type: string
        required_evidence:
          type: array
          items:
            type: string
        policy_profile_id:
          type: string
          format: uuid
        policy_version_id:
          type: string
          format: uuid

    BlockedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        status:
          type: integer
          example: 403
        error:
          type: string
          example: "Action blocked by policy"
        reason_code:
          type: string
        reason_details:
          type: array
          items:
            type: string
        policy_profile_id:
          type: string
          format: uuid
        policy_version_id:
          type: string
          format: uuid

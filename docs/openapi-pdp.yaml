          type: string
          format: uuid
        requester_id:
          type: string
        actions:
          type: array
          items:
            type: object
            required:
              - customer_id
              - action_type
            properties:
              customer_id:
                type: string
              contract_id:
                type: string
              action_type:
                type: string
              channel:
                type: string
              consent_status:
                type: string
              message:
                type: string

    BulkContactActionResponse:

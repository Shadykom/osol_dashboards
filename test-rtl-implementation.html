<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTL Implementation Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Import the RTL styles */
        @import url('/src/styles/rtl.css');
        
        /* Additional test styles */
        .test-card {
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            background: white;
        }
        
        .test-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-right">اختبار تطبيق RTL</h1>
        
        <!-- Test Card with Icon and Label -->
        <div class="test-card" data-slot="card">
            <div class="flex items-center justify-between" data-slot="card-header">
                <div>
                    <h2 class="text-xl font-semibold" data-slot="card-title">نظرة عامة</h2>
                    <p class="text-gray-600 text-sm mt-1" data-slot="card-description">ملخص شامل للأداء</p>
                </div>
                <svg class="test-icon text-blue-500" viewBox="0 0 24 24">
                    <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                </svg>
            </div>
            <div class="mt-4" data-slot="card-content">
                <div class="grid grid-cols-3 gap-4">
                    <div class="text-center">
                        <p class="text-2xl font-bold">١٢٣٤</p>
                        <p class="text-sm text-gray-600">إجمالي العملاء</p>
                    </div>
                    <div class="text-center">
                        <p class="text-2xl font-bold">٥٦٧٨</p>
                        <p class="text-sm text-gray-600">الحسابات النشطة</p>
                    </div>
                    <div class="text-center">
                        <p class="text-2xl font-bold">٩٠١٢</p>
                        <p class="text-sm text-gray-600">المعاملات</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Test Buttons with Icons -->
        <div class="test-card">
            <h3 class="text-lg font-semibold mb-4">الإجراءات</h3>
            <div class="flex gap-4">
                <button class="flex items-center px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                    <svg class="test-icon mr-2" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
                    </svg>
                    إضافة عميل جديد
                </button>
                <button class="flex items-center px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
                    <svg class="test-icon mr-2" viewBox="0 0 24 24">
                        <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                    إنشاء تقرير
                </button>
            </div>
        </div>
        
        <!-- Test Labels and Form Elements -->
        <div class="test-card">
            <h3 class="text-lg font-semibold mb-4">نموذج اختبار</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        اسم العميل
                    </label>
                    <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md text-right" placeholder="أدخل اسم العميل">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        نوع الحساب
                    </label>
                    <select class="w-full px-3 py-2 border border-gray-300 rounded-md text-right">
                        <option>حساب جاري</option>
                        <option>حساب توفير</option>
                        <option>حساب استثماري</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Test Grid Layout -->
        <div class="grid grid-cols-2 gap-4">
            <div class="test-card">
                <div class="flex items-center justify-between">
                    <span class="text-lg font-semibold">المخاطر</span>
                    <span class="px-3 py-1 bg-red-100 text-red-800 rounded-full text-sm">مرتفع</span>
                </div>
            </div>
            <div class="test-card">
                <div class="flex items-center justify-between">
                    <span class="text-lg font-semibold">الأداء</span>
                    <span class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm">ممتاز</span>
                </div>
            </div>
        </div>
        
        <!-- Language Toggle for Testing -->
        <div class="mt-8 text-center">
            <button onclick="toggleDirection()" class="px-6 py-3 bg-purple-500 text-white rounded hover:bg-purple-600">
                تبديل الاتجاه (Toggle Direction)
            </button>
        </div>
    </div>
    
    <script>
        function toggleDirection() {
            const html = document.documentElement;
            const currentDir = html.getAttribute('dir');
            const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
            const newLang = currentDir === 'rtl' ? 'en' : 'ar';
            
            html.setAttribute('dir', newDir);
            html.setAttribute('lang', newLang);
        }
    </script>
</body>
</html>

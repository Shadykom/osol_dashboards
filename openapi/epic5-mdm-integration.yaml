openapi: 3.1.0
info:
  title: CMS MDM & Integration API - EPIC 5
  version: 1.0.0
  description: |
    Master Data Management and Integration APIs for the Collection Management System.
    
    ## Multi-Tenancy
    All requests must include `x-tenant-id` header.
    
    ## Schemas
    - mdm: Master Data Management tables
    - integration: Data ingestion and freshness tables

servers:
  - url: http://localhost:3001/api/v1
    description: Local development server

tags:
  - name: MDM - Sources
    description: Source system management
  - name: MDM - Reference Data
    description: Reference data (countries, nationalities, etc.)
  - name: MDM - Parties
    description: Party golden records
  - name: MDM - Contracts
    description: Contract golden records
  - name: MDM - Users
    description: User profile management
  - name: MDM - Data Quality
    description: Data quality issue management
  - name: Integration - Ingest
    description: Data ingestion endpoints
  - name: Integration - Runs
    description: Ingestion run management
  - name: Integration - Freshness
    description: Data freshness monitoring
  - name: Integration - Mappings
    description: Mapping template management
  - name: Integration - Config
    description: Integration configuration

paths:
  # ========== MDM - Sources ==========
  /mdm/sources:
    get:
      operationId: listSourceSystems
      summary: List source systems
      tags:
        - MDM - Sources
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, deprecated]
      responses:
        '200':
          description: List of source systems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSystemList'
    post:
      operationId: createSourceSystem
      summary: Create source system
      tags:
        - MDM - Sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceSystem'
      responses:
        '201':
          description: Source system created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSystem'

  /mdm/sources/{id}:
    get:
      operationId: getSourceSystem
      summary: Get source system by ID
      tags:
        - MDM - Sources
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Source system details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceSystem'
    patch:
      operationId: updateSourceSystem
      summary: Update source system
      tags:
        - MDM - Sources
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceSystem'
      responses:
        '200':
          description: Source system updated

  # ========== MDM - Reference Data ==========
  /mdm/reference-data:
    get:
      operationId: listReferenceData
      summary: List reference data
      tags:
        - MDM - Reference Data
      parameters:
        - name: domain
          in: query
          schema:
            type: string
          description: Filter by domain (COUNTRY, NATIONALITY, etc.)
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        '200':
          description: List of reference data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceDataList'
    post:
      operationId: createReferenceData
      summary: Create reference data
      tags:
        - MDM - Reference Data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReferenceData'
      responses:
        '201':
          description: Reference data created

  /mdm/reference-data/domains:
    get:
      operationId: listDomains
      summary: List available domains
      tags:
        - MDM - Reference Data
      responses:
        '200':
          description: List of domains with counts

  /mdm/reference-data/{id}:
    get:
      operationId: getReferenceData
      summary: Get reference data by ID
      tags:
        - MDM - Reference Data
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Reference data details
    patch:
      operationId: updateReferenceData
      summary: Update reference data
      tags:
        - MDM - Reference Data
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReferenceData'
      responses:
        '200':
          description: Reference data updated

  # ========== MDM - Parties ==========
  /mdm/parties:
    get:
      operationId: listParties
      summary: Search and list parties
      tags:
        - MDM - Parties
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: party_type
          in: query
          schema:
            type: string
            enum: [PERSON, ORGANIZATION]
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: List of parties
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyList'

  /mdm/parties/{party_id}:
    get:
      operationId: getParty
      summary: Get party with full details
      tags:
        - MDM - Parties
      parameters:
        - name: party_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Party details with contacts and DQ issues
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyDetail'
    patch:
      operationId: updateParty
      summary: Update party golden record
      tags:
        - MDM - Parties
      parameters:
        - name: party_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateParty'
      responses:
        '200':
          description: Party updated

  /mdm/parties/{party_id}/sources:
    get:
      operationId: getPartySources
      summary: Get party source mappings
      tags:
        - MDM - Parties
      parameters:
        - name: party_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of source mappings

  /mdm/parties/{party_id}/contracts:
    get:
      operationId: getPartyContracts
      summary: Get contracts for a party
      tags:
        - MDM - Parties
      parameters:
        - name: party_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of contracts

  # ========== MDM - Users ==========
  /mdm/users:
    get:
      operationId: listUsers
      summary: List users with MDM profiles
      tags:
        - MDM - Users
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: has_profile
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of users with profiles

  /mdm/users/{user_id}/profile:
    patch:
      operationId: updateUserProfile
      summary: Update user MDM profile
      tags:
        - MDM - Users
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfile'
      responses:
        '200':
          description: Profile updated

  # ========== Integration - Ingest ==========
  /integration/ingest:
    post:
      operationId: ingestData
      summary: Main data ingestion endpoint
      description: |
        Accepts data via FILE (multipart), MANUAL (JSON), or API (JSON) modes.
        Mode is determined by Content-Type and configuration.
      tags:
        - Integration - Ingest
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or XLSX file
                dataset:
                  type: string
                  enum: [PARTY, CONTRACT, CHARGE]
                source_system_code:
                  type: string
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: Ingestion successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '207':
          description: Partial success
        '422':
          description: Ingestion failed

  /integration/ingest/method:
    get:
      operationId: getIntegrationMethod
      summary: Get configured integration method
      tags:
        - Integration - Ingest
      parameters:
        - name: dataset
          in: query
          required: true
          schema:
            type: string
            enum: [PARTY, CONTRACT, CHARGE]
      responses:
        '200':
          description: Integration method for dataset

  /integration/ingest/webhook-info:
    get:
      operationId: getWebhookInfo
      summary: Get webhook endpoint information
      tags:
        - Integration - Ingest
      parameters:
        - name: dataset
          in: query
          schema:
            type: string
        - name: source_system_code
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Webhook info with sample payload

  # ========== Integration - Runs ==========
  /integration/runs:
    get:
      operationId: listIngestionRuns
      summary: List ingestion runs
      tags:
        - Integration - Runs
      parameters:
        - name: dataset
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [running, success, partial, failed]
        - name: source_system
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: List of ingestion runs

  /integration/runs/{run_id}:
    get:
      operationId: getIngestionRun
      summary: Get run with reconciliation summary
      tags:
        - Integration - Runs
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Run details with reconciliation

  /integration/runs/{run_id}/items:
    get:
      operationId: getRunItems
      summary: Get items for a run
      tags:
        - Integration - Runs
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: outcome
          in: query
          schema:
            type: string
            enum: [INSERTED, UPDATED, SKIPPED, FAILED]
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: List of ingestion items

  /integration/runs/{run_id}/errors/csv:
    get:
      operationId: downloadRunErrorsCsv
      summary: Download errors as CSV
      tags:
        - Integration - Runs
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  # ========== Integration - Freshness ==========
  /integration/freshness:
    get:
      operationId: getDataFreshness
      summary: Get data freshness overview
      tags:
        - Integration - Freshness
      parameters:
        - name: dataset
          in: query
          schema:
            type: string
        - name: source_system
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Freshness data with overall health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreshnessOverview'

  # ========== Integration - Mappings ==========
  /integration/mappings:
    get:
      operationId: listMappingTemplates
      summary: List mapping templates
      tags:
        - Integration - Mappings
      parameters:
        - name: dataset
          in: query
          schema:
            type: string
        - name: source_system
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of mapping templates
    post:
      operationId: createMappingTemplate
      summary: Create mapping template
      tags:
        - Integration - Mappings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMappingTemplate'
      responses:
        '201':
          description: Mapping template created

  /integration/mappings/{id}:
    get:
      operationId: getMappingTemplate
      summary: Get mapping template
      tags:
        - Integration - Mappings
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Mapping template details
    patch:
      operationId: updateMappingTemplate
      summary: Update mapping template
      tags:
        - Integration - Mappings
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMappingTemplate'
      responses:
        '200':
          description: Mapping template updated

  # ========== Integration - Config ==========
  /integration/config:
    get:
      operationId: getIntegrationConfig
      summary: Get all integration configuration
      tags:
        - Integration - Config
      responses:
        '200':
          description: Integration configuration

  /integration/config/methods:
    get:
      operationId: getIntegrationMethods
      summary: Get integration methods for all datasets
      tags:
        - Integration - Config
      responses:
        '200':
          description: Methods by dataset
    put:
      operationId: updateIntegrationMethods
      summary: Update integration methods
      tags:
        - Integration - Config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                methods:
                  type: object
                  additionalProperties:
                    type: string
                    enum: [FILE, MANUAL, API, DB]
      responses:
        '200':
          description: Methods updated

components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 100
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0

  schemas:
    SourceSystem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive, deprecated]
        config_json:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SourceSystemList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/SourceSystem'
        meta:
          type: object
          properties:
            count:
              type: integer

    CreateSourceSystem:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        config_json:
          type: object

    UpdateSourceSystem:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive, deprecated]
        config_json:
          type: object

    ReferenceData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        domain:
          type: string
        code:
          type: string
        name_ar:
          type: string
        name_en:
          type: string
        extra_json:
          type: object
        sort_order:
          type: integer
        status:
          type: string
          enum: [active, inactive]

    ReferenceDataList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceData'

    CreateReferenceData:
      type: object
      required:
        - domain
        - code
      properties:
        domain:
          type: string
        code:
          type: string
        name_ar:
          type: string
        name_en:
          type: string
        extra_json:
          type: object
        sort_order:
          type: integer

    UpdateReferenceData:
      type: object
      properties:
        name_ar:
          type: string
        name_en:
          type: string
        extra_json:
          type: object
        sort_order:
          type: integer
        status:
          type: string
          enum: [active, inactive]

    PartyGolden:
      type: object
      properties:
        party_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        party_type:
          type: string
          enum: [PERSON, ORGANIZATION]
        primary_name:
          type: string
        primary_name_ar:
          type: string
        identifiers_json:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              value:
                type: string
        attributes_json:
          type: object
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PartyList:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/PartyGolden'
              - type: object
                properties:
                  dq_issue_count:
                    type: integer
                  source_count:
                    type: integer
        meta:
          type: object
          properties:
            total:
              type: integer
            count:
              type: integer
            limit:
              type: integer
            offset:
              type: integer

    PartyDetail:
      type: object
      allOf:
        - $ref: '#/components/schemas/PartyGolden'
        - type: object
          properties:
            contacts:
              type: array
              items:
                $ref: '#/components/schemas/PartyContact'
            dq_issues:
              type: array
              items:
                $ref: '#/components/schemas/DataQualityIssue'

    PartyContact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        party_id:
          type: string
          format: uuid
        contact_type:
          type: string
          enum: [PHONE, EMAIL, ADDRESS, FAX, MOBILE, OTHER]
        value:
          type: string
        is_primary:
          type: boolean
        is_verified:
          type: boolean

    UpdateParty:
      type: object
      properties:
        primary_name:
          type: string
        primary_name_ar:
          type: string
        attributes_json:
          type: object
        status:
          type: string

    UpdateUserProfile:
      type: object
      properties:
        home_org_unit_id:
          type: string
          format: uuid
          nullable: true
        nationality_code:
          type: string
          nullable: true
        languages_json:
          type: array
          items:
            type: string
        skills_json:
          type: array
          items:
            type: string

    DataQualityIssue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        rule_code:
          type: string
        rule_name:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [open, resolved, ignored, in_progress]
        created_at:
          type: string
          format: date-time

    IngestRequest:
      type: object
      required:
        - dataset
        - source_system_code
        - data
      properties:
        dataset:
          type: string
          enum: [PARTY, CONTRACT, CHARGE]
        source_system_code:
          type: string
        mode:
          type: string
          enum: [FILE, MANUAL, API]
        data:
          type: array
          items:
            type: object
        mapping:
          type: object

    IngestResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            run_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [success, partial, failed]
            stats:
              type: object
              properties:
                totalReceived:
                  type: integer
                totalProcessed:
                  type: integer
                totalInserted:
                  type: integer
                totalUpdated:
                  type: integer
                totalSkipped:
                  type: integer
                totalFailed:
                  type: integer
            dq_issues_count:
              type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              externalRef:
                type: string
              error:
                type: string

    FreshnessOverview:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              source_system_code:
                type: string
              dataset:
                type: string
              last_success_at:
                type: string
                format: date-time
                nullable: true
              last_status:
                type: string
              record_count:
                type: integer
              freshness_status:
                type: string
                enum: [fresh, aging, stale, never]
        meta:
          type: object
          properties:
            overallHealth:
              type: string
              enum: [healthy, degraded, critical, unknown]
            summary:
              type: object
              properties:
                total:
                  type: integer
                fresh:
                  type: integer
                aging:
                  type: integer
                stale:
                  type: integer
                never:
                  type: integer

    CreateMappingTemplate:
      type: object
      required:
        - source_system_code
        - dataset
        - name
        - mapping_json
      properties:
        source_system_code:
          type: string
        dataset:
          type: string
        name:
          type: string
        description:
          type: string
        mapping_json:
          type: object
        is_default:
          type: boolean

    UpdateMappingTemplate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        mapping_json:
          type: object
        is_default:
          type: boolean
        status:
          type: string
          enum: [active, inactive, draft]
